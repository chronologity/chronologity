"""
How precisely an occurrence is known.

History arrives imprecisely, and the product refuses to invent precision it does
not have. A Moment known only as "summer 1998" is that month at `MONTH`
precision and never acquires a fabricated day, so a client must present it as
what it is rather than as a date.
"""
enum TemporalPrecision {
  """
  Known to the moment.
  """
  INSTANT

  """
  Known to the day.
  """
  DAY

  """
  Known to the month.
  """
  MONTH

  """
  Known to the year.
  """
  YEAR
}

"""
When something happened, as an interval at the precision it is actually known.

`start` and `end` bound where the occurrence is known to fall. At `INSTANT`
precision they are equal; at `YEAR` they span the year. This is historical
position and never when the record was made — a Moment entered today for 2014
belongs in 2014.
"""
type Occurrence {
  start: DateTime!
  end: DateTime!
  precision: TemporalPrecision!
}

"""
Which way a page runs through history.
"""
enum TimelineDirection {
  """
  Backwards, towards the past.
  """
  OLDER

  """
  Forwards, towards the present.
  """
  NEWER
}

"""
How coarsely history is being read.

Finest to coarsest, which is the order somebody zooms out through. Below `day`
is the Timeline itself, one Moment per row: a scale is a span of time, and the
ungrouped slice is not one.
"""
enum TimelineScale {
  DAY
  WEEK
  MONTH
  YEAR
  DECADE
  CENTURY
}

"""
What kind of thing a stretch of history is about.
"""
enum TimelineScopeType {
  """
  Somebody's history: what they recorded, together with what they took part in.
  """
  PERSON

  """
  A place.
  """
  LOCATION

  """
  An occasion in the world that Moments were part of.
  """
  REAL_WORLD_EVENT
}

"""
Whose history, or what's, is being read.

Carried on a page so a client can restore where it was without having to
remember what it asked for.
"""
type TimelineScope {
  type: TimelineScopeType!
  id: ID!
}

"""
A Moment as a Timeline presents it.

Deliberately thin: where it sits in history and what its occurrence claims, and
nothing it says. A caption is read by opening the Moment, which keeps somebody's
words out of a read model built to be rebuilt.
"""
type ReadableTimelineEntry {
  momentId: ID!

  """
  When it happened. Never when it was recorded.
  """
  occurredAt: DateTime!

  occurrenceEnd: DateTime!

  """
  What the occurrence claims, so a month is never presented as a day.
  """
  occurrencePrecision: TemporalPrecision!

  """
  How far from UTC the person was when it happened.

  What makes "half past seven in the evening" mean anything. A timestamp alone
  keeps the instant and throws that away.
  """
  occurrenceOffsetMinutes: Int!

  """
  Who may see it.
  """
  visibility: MomentVisibility!

  """
  Whether it may be offered to somebody who did not ask for it.
  """
  discoverable: Boolean!
}

"""
A Moment somebody was part of and may not read.

Appears only on that person's own Timeline. They accepted participation, so they
are entitled to know it happened — their own history should not have a hole they
cannot see the shape of — but accepting granted them nothing, so what it says
stays shut.

Its own type rather than the readable one with fields left out. A client cannot
read a field that is not there, and a field that is merely null is
indistinguishable from one that failed to load.

**It carries no offset.** A UTC offset is a weak statement about where somebody
was — the one field in the occurrence set that says anything about place rather
than time — so the times come back in UTC and nothing else comes back at all.
"""
type WithheldTimelineEntry {
  momentId: ID!
  occurredAt: DateTime!
  occurrenceEnd: DateTime!
  occurrencePrecision: TemporalPrecision!
}

"""
A Moment in a Timeline, readable or not.

Everything a Location's or an occasion's Timeline returns is readable, because
such a read filters rather than reports: a Moment somebody may not see is absent
from it, because its existence is not theirs to know. Only somebody's own
Timeline carries the other kind.
"""
union TimelineEntry = ReadableTimelineEntry | WithheldTimelineEntry

"""
One Moment in a page, with the position it sits at.
"""
type TimelineEdge {
  """
  Where to resume from here.
  """
  cursor: Cursor!

  node: TimelineEntry!
}

"""
A page of history, and where it sits.
"""
type TimelineConnection {
  edges: [TimelineEdge!]!
  pageInfo: PageInfo!

  """
  Whose history this is, so a client can restore where it was.
  """
  scope: TimelineScope!
}

"""
One span of history, and a little of what was in it.
"""
type TemporalBucket {
  """
  When the span begins. Where it ends follows from the distribution's scale.
  """
  startsAt: DateTime!

  """
  How much history the span holds.

  Counts what the reader may be told about and nothing else: a count reveals that
  something exists, so one taken before eligibility would tell somebody how much
  they are not being shown. On a reader's own Timeline it does include Moments
  they may not read, because paging their own history returns those redacted
  rather than removing them — a count and the page it summarises must agree.

  For conveying how full a span is, not for reading as a figure. It is never the
  number of `representatives`, which is what may be *shown* and is fewer.
  """
  count: Int!

  """
  A few of the Moments this span holds.

  Chosen by historical significance, and never more than one per person, so that
  somebody who recorded a single afternoon forty times does not become the whole
  decade.

  Always readable, on every Timeline including your own. A redacted entry carries
  a date and nothing else, which is enough to say something happened and not
  enough to say what a span was about — and since a span holds only a few,
  offering one would displace a Moment that could actually speak for it.

  Empty is an ordinary answer, not a failure: a span whose history is entirely
  withheld from this reader still has a count. Never null.
  """
  representatives: [ReadableTimelineEntry!]!
}

"""
How history is distributed across a stretch of time.

The same Timeline as `timeline`, at a coarser density — same axis, same
chronological order, same direction of travel. Each row covers a stretch rather
than an instant and carries a few of the Moments inside it. `timeline` is the
finest rung of this ladder, one Moment per row.

Spans holding nothing are absent rather than zero: a century of silence is not a
hundred rows of nothing. A client draws the empty ones itself, from `scale` and
the interval below.
"""
type TemporalDistribution {
  """
  Oldest first, one per span that holds anything.
  """
  buckets: [TemporalBucket!]!

  """
  How coarsely this was read. One scale for the whole answer.
  """
  scale: TimelineScale!

  """
  The earliest instant read, and the latest.

  Returned rather than assumed, because a rolling range — "the last thirty days"
  — resolves against the instant the request arrived, which a client cannot
  recompute. Without these it could not know which empty spans to draw.
  """
  from: DateTime!
  to: DateTime!

  scope: TimelineScope!
}

"""
Where a jump landed, and the history either side of it.

The instant asked for need not be one anything happened at. When nothing did,
`at` is null and the surrounding pages still answer — the position is preserved
rather than quietly redefined as whichever Moment was nearest.
"""
type TimelineAround {
  """
  The Moment at the position, or null when nothing happened there.
  """
  at: TimelineEntry

  """
  History before it.
  """
  older: TimelineConnection!

  """
  History after it.
  """
  newer: TimelineConnection!
}

"""
Which lens is applied to a person's Moments.

Whose history is a different question from which of it. "What my father
photographed" and "where my father was" are different questions about the same
person, and only a person's Timeline can tell them apart.

A place and an occasion have one lens, `ALL`: nothing about a place
distinguishes recording from taking part. Asking either for another is refused
rather than quietly answered as `ALL`, because a request that meant something
other than it said would be worse than one that failed.
"""
enum TimelinePerspective {
  """
  What they recorded, together with what they took part in.
  """
  ALL

  """
  Only what they recorded.
  """
  AUTHORED

  """
  Only what somebody else recorded that they took part in.
  """
  PARTICIPATED
}

"""
Whose history, or what's, to read.
"""
input TimelineScopeInput {
  type: TimelineScopeType!
  id: ID!
}

"""
Narrowing within a scope, without changing what the scope is.

Closed and enumerated on purpose. A Timeline is chronology over a scope and
Search is what answers questions; accepting arbitrary predicates here would make
this a second query language beside Search.

A filter naming the same kind of thing as the scope is refused: filtering a
place's Timeline by that place says nothing, and by a different one can never
hold anything.
"""
input TimelineFiltersInput {
  """
  Only Moments this person recorded.
  """
  authorUserId: ID

  """
  Only Moments at this place.
  """
  locationId: ID

  """
  Only Moments that were part of this occurrence.
  """
  realWorldEventId: ID
}

"""
A stretch of history, meant literally.

Asked for again in ten years it is the same interval it always was: August 1969
is August 1969.
"""
input FixedRangeInput {
  from: DateTime!
  to: DateTime!
}

"""
The unit a rolling window is counted in.
"""
enum RollingRangeUnit {
  DAY
  MONTH
  YEAR
}

"""
A stretch of history counted back from now.

`{ unit: DAY, count: 30 }` is the last thirty days, and it means the thirty days
before the request rather than before anything was saved — which is what lets a
stored view go on meaning "recently".
"""
input RollingRangeInput {
  unit: RollingRangeUnit!

  """
  How many units, counting back from now. At least one, and at most a thousand.
  """
  count: Int!
}

"""
A stretch of history, fixed or rolling.

Exactly one. A fixed span and a rolling one are genuinely different things and
supplying both is refused rather than resolved by precedence; supplying neither
is refused too, since a range naming no stretch of time narrows nothing and is
likelier a client dropping a field than an intention.

Two nullable fields rather than a directive that would enforce the choice in the
schema. `@oneOf` exists but was experimental in the GraphQL version this service
is built on, and client tooling that does not understand it would refuse the
whole schema — which would cost exactly what the connection convention was
adopted to buy.
"""
input TimelineRangeInput {
  fixed: FixedRangeInput
  rolling: RollingRangeInput
}

"""
A perspective on history: whose, which of it, and over what stretch.

Everything except where the reader had got to, which the paging arguments carry.
The same description a Saved View will store and a shared link will carry, so a
Timeline means the same thing however it was arrived at.
"""
input TimelineViewInput {
  scope: TimelineScopeInput!

  """
  Which lens. Only a person's Timeline has more than one.
  """
  perspective: TimelinePerspective = ALL

  filters: TimelineFiltersInput

  """
  The stretch of history to read, or the whole of it when absent.
  """
  range: TimelineRangeInput
}
