"""
Chronologity's read contract.

This schema is written in product terms and never mirrors storage. Nothing in it
names a ClickHouse column, a projection version, or a table: mobile navigates
history, and how history is stored is this service's business rather than the
client's.

There are no mutations, and there will not be. Commands belong to the API. A
mutation is not added here merely because GraphQL supports one.

The types history is described in are defined here; the queries that return them
arrive with the phases that compose each one. A type nothing yet returns is
still part of the contract — it is what mobile will be written against — but a
query is not declared until something can answer it.
"""
type Query {
  """
  Who this service thinks is asking.

  Resolved from the request's credentials, never from anything the client
  asserts about itself. It exists so a client can tell an expired session from
  a quiet one: a Timeline that returned less than expected is a different
  problem depending on the answer here.
  """
  viewer: Viewer!

  """
  Where a Timeline opens.

  The newest **occurrence** it holds, which is not the newest recording: a
  photograph added today of 1969 belongs in 1969, and letting it become the head
  would put somebody at the wrong end of history the moment they backfilled
  anything. A head is a position in time and never a ranking.

  Null when the view holds nothing. That includes a Timeline its owner has
  closed, which answers as though it were empty rather than refusing — refusing
  would itself say there was something there.
  """
  timelineHead(view: TimelineViewInput!): TimelineEntry

  """
  A page of history, newest first.

  `first` and `after` walk back into the past; `last` and `before` come forward
  towards the present. Either way the page is ordered newest first, so paging
  back and then forward returns the same Moments in the same order.

  The two pairs are alternatives: asking for both ends at once is refused rather
  than resolved by precedence. Asking for neither opens the Timeline at its head.
  """
  timeline(
    view: TimelineViewInput!

    """
    How many Moments, walking into the past. At least one, and at most 200.
    """
    first: Int

    """
    Resume after this position, walking into the past.
    """
    after: Cursor

    """
    How many Moments, walking towards the present.
    """
    last: Int

    """
    Resume before this position, walking towards the present.
    """
    before: Cursor
  ): TimelineConnection!

  """
  One Moment, in full.

  Null is the only refusal, and it means every reason at once: there is no such
  Moment, it is private, its author blocked you, you are not on its list, or
  Chronologity withheld it. Telling them apart would disclose which one applied,
  and knowing an identifier has never granted access to what it names.
  """
  moment(id: ID!): Moment

  """
  One occurrence in the world.

  Null is the only refusal, and it means both reasons at once: there is no such
  occurrence, or none of its history is yours to read. Telling them apart would
  say one exists, which is itself the thing that may be sensitive.
  """
  realWorldEvent(id: ID!): RealWorldEvent

  """
  Where else this stretch of history reaches.

  Contexts sharing history with the one named come first, marked as such; beyond
  them the axis continues into whatever else was going on around the same time.
  It does not run out.

  Asking this of a person is refused rather than answered emptily: an empty
  answer would itself be a claim about them.
  """
  adjacentContexts(
    scope: TimelineScopeInput!

    """
    Where on the time axis the reader is standing.
    """
    at: DateTime!

    """
    How many at most. At least one, and at most fifty.
    """
    first: Int

    after: Cursor
  ): HistoricalContextConnection!

  """
  The same history, read span by span rather than Moment by Moment.

  This is `timeline` zoomed out: the same axis in the same order, with each row
  covering a stretch of time and carrying a few of the Moments inside it. Zooming
  all the way in is `timeline` itself, one Moment per row.

  The view must name a stretch of time, and the stretch and the scale together
  must not be more spans than one request can answer — a decade day by day is
  refused rather than cut short, because a distribution that was trimmed
  misstates the shape of somebody's history and nothing in the answer would say
  so. Ask for a shorter stretch, or read it more coarsely.
  """
  temporalDistribution(
    view: TimelineViewInput!

    """
    How coarsely to read it.
    """
    scale: TimelineScale!
  ): TemporalDistribution!

  """
  Go straight somewhere, without reading everything in between.

  A Timeline spanning decades cannot be navigated only by scrolling. Name a
  destination — a Moment, an instant, a place, an occasion, a relationship to
  follow, or what a span of history was about — and this answers with the
  position and the history either side of it, so ordinary navigation carries on
  from where you land.

  **The position is preserved rather than redefined.** Jumping to a time nothing
  happened at lands at that time, with `at` null and the surrounding pages
  showing what lies either side. It is not quietly reported as whichever Moment
  happened to be nearest.

  **A jump may cross into another Timeline** — a relationship pointing at
  somebody else's Moment takes you to that Moment, not to your own history on the
  same date — and `scope` says which one you arrived in.

  Every destination is checked afresh for you on arrival. A destination that is
  not yours to reach answers with an empty position, in the same shape as one
  that never existed: knowing an identifier has never granted access to what it
  names.
  """
  timelineAround(
    view: TimelineViewInput!
    anchor: TimelineAnchorInput!

    """
    How much history to return either side. At least one, and at most 200.
    """
    first: Int
  ): TimelineAround!
}

"""
The reader of a request.

Anonymous is an ordinary state rather than a failure: a request offering no
credential resolves to it and is answered. It is simply a state that reads no
history. Reading history requires an account, because a Block is between two
accounts and somebody who could read signed out would have routed around one.

A request whose credentials do not hold up is neither of these. It is refused,
so that a client with an expired token is told to refresh rather than quietly
shown less of somebody's history than it asked for. A request that is signed in
but has not finished creating an account is refused differently again, so a
client sends that person to onboarding rather than back to signing in.
"""
type Viewer {
  """
  Whether the request carried credentials that held up.
  """
  authenticated: Boolean!

  """
  The account reading, once there is one.

  Null for an anonymous reader, and also for somebody who has signed in but has
  not finished creating an account — an ordinary state, not an error.
  """
  userId: ID
}
