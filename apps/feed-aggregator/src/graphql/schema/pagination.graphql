"""
Where a page sits, and whether there is more history either side of it.

History is paged by position rather than by page number, and the difference is
the product rather than performance: history grows in the middle. A photograph
uploaded today may belong to 1969, so an offset taken a moment ago now points
somewhere else, and paging with it would repeat some Moments and skip others.

The field names follow the convention GraphQL clients already know, so a client
library can page this without being taught the shape.
"""
type PageInfo {
  """
  Where this page begins, or null when it holds nothing.

  Nullable because an empty page has no ends. A page that holds anything has
  both.
  """
  startCursor: Cursor

  """
  Where this page ends, or null when it holds nothing.
  """
  endCursor: Cursor

  """
  Whether history continues further back.

  A page is ordered newest first whichever way it was walked, so this is the
  end a client keeps following to read a life backwards.

  False means history ran out. It does not mean the page came back short for
  some other reason: what a Viewer may see is decided inside the query, before
  the page is filled, so a page holds as many Moments as history has and its
  size never says what was withheld.
  """
  hasNextPage: Boolean!

  """
  Whether there is more history between this page and the present.

  True whenever the page was reached from a cursor, since every cursor was
  taken from a Moment that was returned. The one case where following it back
  yields an empty page is a cursor whose Moment has since been erased.
  """
  hasPreviousPage: Boolean!
}
